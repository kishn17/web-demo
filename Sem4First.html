<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .sneaker {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 250px;
            text-align: center;
            padding: 15px;
        }
        .sneaker img {
            width: 100%;
            border-radius: 10px;
        }
        .sneaker h3 {
            margin: 10px 0;
        }
        .sneaker p {
            color: #888;
        }
        .sneaker button {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .sneaker button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Sneakers Shop</h1>
        <p>Your one-stop destination for the latest and greatest sneakers</p>
    </header>

    <div class="container">
        <!-- Sneaker 1 -->
        <div class="sneaker">
            <img src="https://via.placeholder.com/250x250?text=Sneaker+1" alt="Sneaker 1">
            <h3>Nike Air Max</h3>
            <p>$120</p>
            <button>Add to Cart</button>
        </div>

        <!-- Sneaker 2 -->
        <div class="sneaker">
            <img src="https://via.placeholder.com/250x250?text=Sneaker+2" alt="Sneaker 2">
            <h3>Adidas UltraBoost</h3>
            <p>$150</p>
            <button>Add to Cart</button>
        </div>

        <!-- Sneaker 3 -->
        <div class="sneaker">
            <img src="https://via.placeholder.com/250x250?text=Sneaker+3" alt="Sneaker 3">
            <h3>Puma RS-X</h3>
            <p>$110</p>
            <button>Add to Cart</button>
        </div>

        <!-- Sneaker 4 -->
        <div class="sneaker">
            <img src="https://via.placeholder.com/250x250?text=Sneaker+4" alt="Sneaker 4">
            <h3>Reebok Classic</h3>
            <p>$90</p>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
